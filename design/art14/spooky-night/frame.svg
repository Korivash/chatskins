<svg xmlns="http://www.w3.org/2000/svg" class="r14-art art-spooky-night" viewBox="0 0 600 680" fill="none" role="img" aria-labelledby="spooky-night-title"><title id="spooky-night-title">Spooky Night original illustrated chat frame</title><defs><g id="spooky-night-heart"><path d="M0 12C-36 -10 -22 -31 -6 -20L0 -13L6 -20C22 -31 36 -10 0 12Z" fill="var(--base)" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g id="spooky-night-star"><path d="M0 -23L6 -6L23 0L6 6L0 23L-6 6L-23 0L-6 -6Z" fill="currentColor" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g id="spooky-night-bean"><path d="M-14 12C-30 -11 -3 -32 14 -14C33 9 4 32 -14 12Z" fill="var(--base)" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 15Q10 0 5 -17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g id="spooky-night-bat"><path d="M-35 -10Q-21 -8 -17 -23L-7 -3L-3 -14L1 -6L6 -14L10 -3L19 -23Q23 -8 38 -10L26 12Q15 1 8 17L0 10L-8 17Q-19 0 -26 12Z" fill="var(--base)" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g id="spooky-night-glyph"><path d="M-19 -17H3V-4H19M-8 -23V18H8V6H23M-22 7H-14M15 -23V-13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g id="spooky-night-gem"><path d="M-20 -8L-10 -22H10L20 -8L0 21Z" fill="var(--secondary)" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20 -8H20M-10 -22L0 21L10 -22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g id="spooky-night-bolt"><circle cx="0" cy="0" r="16" fill="var(--base)" stroke="currentColor" stroke-width="2" /><path d="M-6 -6L6 6M6 -6L-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g id="sp