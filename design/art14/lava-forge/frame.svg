><path clip-rule="evenodd" d="M0 0H600V680H0Z M74 155V585H526V155Z"/></clipPath></defs><style>.art-lava-forge{--base:#271714;--secondary:#ef9f8d;color:#ffcb93;overflow:hidden}.art-lava-forge [data-layer]{color:var(--layer-color,#ffcb93)}.art-lava-forge .pulse{animation:r14-pulse 4s ease-in-out infinite alternate}.art-lava-forge .float{animation:r14-float 8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.art-lava-forge .particle{animation:r14-travel var(--speed) linear infinite;animation-delay:var(--delay)}.art-lava-forge .jitter{animation:r14-jitter 7s steps(1,end) infinite}.art-lava-forge .radar{transform-origin:0px -8px;animation:r14-spin 10s linear infinite}.art-lava-forge .lamp{animation:r14-pulse 3.2s linear infinite alternate;animation-delay:var(--delay)}.art-lava-forge .steam{animation:r14-pulse 7s ease-in-out infinite alternate}@keyframes r14-pulse{from{opacity:.45}to{opacity:1}}@keyframes r14-float{from{rotate:-2deg}to{rotate:2deg}}@keyframes r14-travel{0%{translate:0 20px;opacity:0}20%,75%{opacity:.8}100%{translate:var(--drift) -36px;opacity:0}}@keyframes r14-jitter{0%,94%,100%{translate:0;opacity:.5}95%{translate:3px;opacity:.9}97%{translate:-2px;opacity:.3}}@keyframes r14-spin{to{rotate:360deg}}@media(prefers-reduced-motion:reduce){.art-lava-forge *{animation:none!important}.art-lava-forge .particle{opacity:.45}}[data-motion=off] .art-lava-forge *{animation:none!important}[data-motion=off] .art-lava-forge .particle{opacity:.45}.art-lava-forge [data-layer=edges] .pulse{animation-duration:4.8s}.art-lava-forge [data-layer=edges] .pulse:nth-child(even){animation-delay:-1.2s}</style><g data-structural="chassis"><path d="M88 57L244 77L300 40L361 76L515 58L548 139L529 545L468 609L300 650L130 611L70 548L51 141Z" fill="#271714" stroke="#ffcb93" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M88 57L244 77L300 40L361 76L515 58L548 139L529 545L468 609L300 650L130 611L70 548L51 141Z" fill="none" stroke="#ef9