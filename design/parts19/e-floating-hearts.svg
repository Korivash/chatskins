<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" ><title>Floating hearts</title><g fill="var(--c1,#bca7ed)" stroke="var(--c2,#433458)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><style>@keyframes studio19-e-floating-hearts{0%,100%{opacity:.45;transform:translateY(0)}50%{opacity:.8;transform:translateY(-6px)}}.motion.e-floating-hearts{animation:studio19-e-floating-hearts 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.motion.e-floating-hearts{animation:none!important;transform:none!important;opacity:.45}}</style><g class="motion e-floating-hearts" opacity=".45"><path d="M50 83C-10 48 23 12 50 37C77 12 110 48 50 83Z" /></g></g></svg>