<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" ><title>Shimmer sweep</title><g fill="var(--c1,#bca7ed)" stroke="var(--c2,#433458)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><style>@keyframes studio19-e-shimmer-sweep{0%,100%{opacity:.45;transform:translateX(0)}50%{opacity:.8;transform:translateX(12px)}}.motion.e-shimmer-sweep{animation:studio19-e-shimmer-sweep 14s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.motion.e-shimmer-sweep{animation:none!important;transform:none!important;opacity:.45}}</style><g class="motion e-shimmer-sweep" opacity=".45"><path d="m15 85 35-70h15L30 85Z" fill="var(--glow,#fff0b5)" stroke="none"/></g></g></svg>