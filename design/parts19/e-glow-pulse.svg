<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" ><title>Glow pulse</title><g fill="var(--c1,#bca7ed)" stroke="var(--c2,#433458)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><style>@keyframes studio19-e-glow-pulse{0%,100%{opacity:.45;transform:translateY(0)}50%{opacity:.8;transform:translateY(0px)}}.motion.e-glow-pulse{animation:studio19-e-glow-pulse 13s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.motion.e-glow-pulse{animation:none!important;transform:none!important;opacity:.45}}</style><g class="motion e-glow-pulse" opacity=".45"><rect x="9" y="9" width="82" height="82" rx="14" fill="none" stroke="var(--glow,#fff0b5)" stroke-width="8"/></g></g></svg>