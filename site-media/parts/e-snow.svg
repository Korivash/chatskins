<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" ><title>Snow</title><g fill="var(--c1,#bca7ed)" stroke="var(--c2,#433458)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><style>@keyframes studio19-e-snow{0%,100%{opacity:.45;transform:translateY(0)}50%{opacity:.8;transform:translateY(6px)}}.motion.e-snow{animation:studio19-e-snow 9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.motion.e-snow{animation:none!important;transform:none!important;opacity:.45}}</style><g class="motion e-snow" opacity=".45"><path d="M50 12v76M17 31l66 38M17 69l66-38M40 17l10 10 10-10M40 83l10-10 10 10" fill="none"/></g></g></svg>