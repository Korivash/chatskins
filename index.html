<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat studio</title><link rel="stylesheet" href="css/app.css"><script type="module" src="js/editor.js"></script></head><body class="editor"><header class="app-header"><div class="brand">Chat studio</div><div class="header-tools"><span id="skin-label">Clean</span><button id="undo">Undo</button><button id="redo">Redo</button></div></header><div class="workspace"><aside class="rail"><div class="rail-scroll"><input id="search" placeholder="Find a setting" aria-label="Find a setting"><section class="gallery-section"><h2>Skins</h2><div id="gallery" class="gallery"></div><button id="scratch">Start from scratch</button></section><details open><summary>My skins</summary><div id="my-skins"></div><button id="save-skin">Save skin</button><button id="export-skins">Export JSON</button><label class="button">Import JSON<input id="import-skins" type="file" accept="application/json" hidden></label></details><div id="settings"></div></div><footer class="actions"><label for="channel">Twitch channel</label><input id="channel" placeholder="channel" aria-label="Twitch channel"><button id="copy" class="primary">Copy overlay URL</button><button id="reset">Reset to skin</button><div id="notice" role="status"></div></footer></aside><main class="preview"><div class="toolbar"><button data-mode="fake">Fake chat</button><button data-mode="live">Live channel</button><span id="status" role="status">Sample chat</span><button data-bg="dark">Dark</button><button data-bg="light">Light</button><button data-bg="checker">Checker</button><button id="burst">Burst 10</button></div><div class="preview-body"><div id="stage" class="stage checker"><div class="source"><div id="chat" class="chat"></div></div></div><p id="caption" class="caption">1280 × 720 · Fit · source px</p></div></main></div></body></html>
