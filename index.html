<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat studio — Overlay editor</title><link rel="stylesheet" href="css/app.css"><script type="module" src="js/editor.js"></script></head><body class="editor"><header class="app-header"><div class="brand">Chat studio <span>Overlay editor</span></div></header><div class="workspace"><aside class="rail"><div class="rail-scroll"><section class="gallery-section"><h2>Skins</h2><div id="gallery" class="gallery" role="radiogroup" aria-label="Chat skins"></div></section><details open><summary>Font</summary><div class="fields"><label>Family<select data-key="fontFamily"></select></label><label>Size (px)<input data-key="fontSize" type="number" min="12" max="48"></label><label>Weight<select data-key="fontWeight"><option>400</option><option>500</option><option>600</option><option>700</option></select></label><label>Line height<input data-key="lineHeight" type="number" step=".05" min="1.1" max="2"></label></div><p id="font-notice" class="help"></p></details>
<details><summary>Text &amp; Colors</summary><div class="fields"><label>Username color source<select data-key="nameColorMode"><option value="fixed">Fixed</option><option value="twitch">Twitch</option></select></label><label>Name color<input data-key="nameColor" type="color"></label><label>Message color<input data-key="textColor" type="color"></label><label>System color<input data-key="systemColor" type="color"></label><label class="wide">Name format<input data-key="nameFormat"><small>Use {name} once and {channel} optionally.</small></label><label class="check"><input data-key="showBadges" type="checkbox">Show badges</label><label>Outline width (px)<input data-key="outlineWidth" type="number" step=".5"></label><label>Outline color<input data-key="outlineColor" type="color"></label><label class="check"><input data-key="shadowEnabled" type="checkbox">Text shadow</label><label>Shadow color<input data-key="shadowColor" type="color"></label><label>Shadow opacity<input data-key="shadowOpacity" type="number" step=".05"></label><label>Shadow blur (px)<input data-key="shadowBlur" type="number"></label></div></details>
<details><summary>Border</summary><div class="fields"><label>Style<select data-key="borderStyle"><option>none</option><option>line</option><option>double</option><option>corners</option><option>bevel</option><option>pixel</option></select></label><label>Color<input data-key="borderColor" type="color"></label><label>Thickness (px)<input data-key="borderWidth" type="number"></label><label>Corner radius (px)<input data-key="cornerRadius" type="number"></label></div><p class="help" id="pixel-help"></p></details>
<details><summary>Background</summary><div class="fields"><label>Color<input data-key="backgroundColor" type="color"></label><label>Opacity<input data-key="backgroundOpacity" type="number" step=".05"></label><label>Apply to<select data-key="backgroundScope"><option>message</option><option>panel</option></select></label></div></details>
<details><summary>Layout</summary><div class="fields"><label>Horizontal padding (px)<input data-key="paddingX" type="number"></label><label>Vertical padding (px)<input data-key="paddingY" type="number"></label><label>Message gap (px)<input data-key="messageSpacing" type="number"></label><label>Max messages<input data-key="maxMessages" type="number"></label><label class="wide">Lifetime (seconds)<input data-key="messageLifetime" type="number"><small>Enter 0 for never; otherwise 5–180.</small></label><label class="check"><input id="never" type="checkbox">Never expire</label><label>Newest at<select data-key="direction"><option>bottom</option><option>top</option></select></label><label>Alignment<select data-key="alignment"><option>left</option><option>center</option><option>right</option></select></label><label>Stack width (px)<input data-key="overlayWidth" type="number"></label><label>Edge inset (px)<input data-key="edgeInset" type="number"></label></div></details>
<details><summary>Animation</summary><div class="fields"><label>Entrance<select data-key="animationIn"><option>none</option><option>fade</option><option>slide</option><option>pop</option></select></label><label>Duration (ms)<input data-key="animationDuration" type="number" step="10"></label></div></details>
<details><summary>Filters</summary><div class="fields"><label class="check"><input data-key="hideCommands" type="checkbox">Hide commands</label><label class="check"><input data-key="hideBots" type="checkbox">Hide listed bots</label><label class="wide">Bot usernames<input id="bots" type="text"></label><label class="check"><input data-key="hideLinks" type="checkbox">Hide links</label></div></details></div><footer class="actions"><button id="copy" class="primary" disabled>Copy overlay URL</button><button id="reset" title="Reset appearance to Clean">Reset</button><div id="copy-help" class="help">Enter a channel to create your overlay URL.</div><input id="manual-url" hidden aria-label="Overlay URL"></footer></aside>
<main class="preview"><div class="toolbar"><label>Channel<input id="channel" placeholder="your_channel" autocomplete="off"></label><span id="status" role="status">Sample chat</span></div><div class="preview-body"><div class="stage checker"><div class="source"><div id="chat" class="chat"></div></div></div><p class="caption">1280 × 720 source · Scaled to fit · Checkerboard will not appear in OBS</p></div></main></div></body></html>
